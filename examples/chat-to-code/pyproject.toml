[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ratelimit"
version = "0.1.0"
description = "Token-bucket rate limiting for API calls"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["ratelimit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
