name: VS Code Extension

on:
  push:
    branches: [main]
    tags:
      - "vscode-v[0-9]+.[0-9]+.[0-9]+"
    # GitHub treats a new-branch/new-tag push as touching every file, so tag
    # pushes still run even though they rarely diff editors/vscode/** themselves.
    paths:
      - "editors/vscode/**"
      - ".github/workflows/vscode-extension.yml"
  pull_request:
    paths:
      - "editors/vscode/**"
      - ".github/workflows/vscode-extension.yml"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: editors/vscode

jobs:
  build:
    name: Compile, test, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: editors/vscode/package-lock.json

      - run: npm ci

      - run: npm run compile

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests (Extension Development Host)
        run: xvfb-run -a npm run test:integration

      - name: Package .vsix
        run: npm run build:vsix

      - uses: actions/upload-artifact@v7
        with:
          name: syscribe-vscode-extension
          path: editors/vscode/*.vsix

  release:
    name: GitHub release (+ Marketplace publish when configured)
    needs: build
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: editors/vscode/package-lock.json

      - run: npm ci

      - name: Package .vsix for the GitHub release
        run: npm run build:vsix

      - name: Create/update the GitHub release and attach the .vsix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" ./*.vsix --clobber

      # Marketplace publish is opt-in on whether VSCE_PAT is configured (repo
      # Settings > Secrets and variables > Actions), so a release can ship as a
      # downloadable .vsix before the publisher/PAT setup is done, without a
      # failing step blocking it. Once VSCE_PAT exists, the very next
      # vscode-v* tag starts publishing to the Marketplace too.
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::warning::VSCE_PAT secret not set — skipping Marketplace publish. The .vsix is still attached to this GitHub release."
            exit 0
          fi
          npx vsce publish --pat "$VSCE_PAT"
