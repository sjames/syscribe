<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SysML Model Browser</title>
  <script src="/static/js/htmx.min.js"></script>
  <script src="/static/js/mermaid.min.js" defer></script>
  <!-- Sprotty-based editable diagram client (ADR-SYS-DE-001, REQ-TRS-DE-004).
       One static bundle built by crates/syscribe-server/frontend (esbuild),
       served through the same rust_embed static pipeline as the vendored
       libs above — see static_assets.rs. Only mounted for non-Mermaid
       `type: Diagram` elements; Mermaid-kind diagrams are untouched. -->
  <script src="/static/js/diagram-editor.js" defer></script>
  <!-- Live-reload client (Phase 6, `/ws` client wiring). Plain vanilla
       script, no build step — opens a WebSocket to /ws and refreshes the
       tree + any open diagram tab on a {"event":"reload"} broadcast. Placed
       after diagram-editor.js so, once deferred scripts run in document
       order, `window.DiagramEditor` is already defined; `htmx` and this
       page's own tab-management globals (tabState/activeTabId/activateTab/
       refreshActiveTab, defined in the inline <script> at the bottom of
       <body>) are also already set up by then, since that inline script is
       not deferred and therefore runs during parsing, before any deferred
       script executes. -->
  <script src="/static/js/live-reload.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (window.mermaid) {
        mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'loose' });
      }
    });
  </script>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header>
    <span>SysML Model Browser</span>
    <span class="subtitle">Syscribe · Axum + HTMX</span>
  </header>
  <div class="workspace">
    {% block content %}{% endblock %}
  </div>

  <!-- ── Modal overlay ── -->
  <div id="modal-overlay" onclick="handleOverlayClick(event)">
    <div id="modal-box" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">&#x2715;</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════════
    //  Tab management
    // ═══════════════════════════════════════════════════════════════
    // `kind` per tab is the diagram's `diagramKind` frontmatter (data-diagram-
    // kind from tree_items.html). "Mermaid" fetches an HTML fragment and
    // injects it into the plain #mermaid-view container (REQ-TRS-DE-004
    // explicitly leaves that path alone, just simplified off the legacy
    // pan/zoom viewport); every other kind mounts the sprotty editor into
    // the persistent #sprotty-host div instead (ADR-SYS-DE-001) — never
    // both at once, so there's no double-rendering.
    const tabState = new Map(); // id -> { name, kind, html? }
    let activeTabId = null;

    function isSprottyKind(kind) {
      return kind !== 'Mermaid';
    }

    async function openDiagram(id, name, kind) {
      if (tabState.has(id)) {
        activateTab(id);
        return;
      }
      if (isSprottyKind(kind)) {
        tabState.set(id, { name, kind });
        renderTabBar();
        await activateTab(id);
        return;
      }
      try {
        const resp = await fetch('/ui/diagram/' + id);
        const html = await resp.text();
        tabState.set(id, { name, kind, html });
        renderTabBar();
        activateTab(id);
      } catch (err) {
        console.error('Failed to load diagram', id, err);
      }
    }

    async function activateTab(id) {
      activeTabId = id;
      const tab = tabState.get(id);

      if (isSprottyKind(tab.kind)) {
        document.getElementById('mermaid-view').style.display = 'none';
        document.getElementById('sprotty-viewport').style.display = '';
        if (window.DiagramEditor) {
          try {
            await window.DiagramEditor.activate(id);
          } catch (err) {
            console.error('Failed to load diagram model', id, err);
          }
        }
        renderTabBar();
        return;
      }

      document.getElementById('sprotty-viewport').style.display = 'none';
      const diagramEl = document.getElementById('mermaid-view');
      diagramEl.style.display = '';
      diagramEl.innerHTML = tab.html;

      // Trigger Mermaid rendering for any mermaid blocks in the new content
      if (window.mermaid) {
        const nodes = diagramEl.querySelectorAll('pre.mermaid');
        if (nodes.length > 0) {
          mermaid.run({ nodes: Array.from(nodes) });
        }
      }

      renderTabBar();
    }

    // Re-fetch and re-render the currently active diagram tab, discarding
    // any cached/client-side state. Used by live-reload.js after a
    // {"event":"reload"} broadcast from /ws (pushed on every successful
    // guarded write, and by main.rs's file-watcher for edits made outside
    // the running server) so an open diagram reflects the change without
    // requiring the user to close/reopen the tab. No-op if no tab is open.
    async function refreshActiveTab() {
      if (!activeTabId) return;
      const tab = tabState.get(activeTabId);
      if (!tab) return;

      if (isSprottyKind(tab.kind)) {
        if (window.DiagramEditor) {
          window.DiagramEditor.forget(activeTabId);
          try {
            await window.DiagramEditor.activate(activeTabId);
          } catch (err) {
            console.error('Failed to refresh diagram', activeTabId, err);
          }
        }
        return;
      }

      try {
        const resp = await fetch('/ui/diagram/' + activeTabId);
        tab.html = await resp.text();
        await activateTab(activeTabId);
      } catch (err) {
        console.error('Failed to refresh diagram', activeTabId, err);
      }
    }

    function closeTab(id, e) {
      if (e) { e.stopPropagation(); }
      const tab = tabState.get(id);
      tabState.delete(id);
      if (tab && isSprottyKind(tab.kind) && window.DiagramEditor) {
        window.DiagramEditor.forget(id);
      }
      if (activeTabId === id) {
        const remaining = [...tabState.keys()];
        if (remaining.length > 0) {
          activateTab(remaining[remaining.length - 1]);
        } else {
          activeTabId = null;
          const diagramEl = document.getElementById('mermaid-view');
          diagramEl.innerHTML = '';
          diagramEl.style.display = '';
          document.getElementById('sprotty-viewport').style.display = 'none';
        }
      }
      renderTabBar();
    }

    function renderTabBar() {
      const bar = document.getElementById('canvas-tabs');
      const inner = document.getElementById('canvas-tabs-inner');
      if (!bar || !inner) return;
      if (tabState.size === 0) {
        bar.style.display = 'none';
        return;
      }
      bar.style.display = '';
      inner.innerHTML = [...tabState.entries()].map(([id, { name }]) => {
        const isActive = id === activeTabId;
        return `<div class="canvas-tab${isActive ? ' active' : ''}" onclick="activateTab(${JSON.stringify(id)})">
          <span class="tab-icon">&#x25C8;</span>
          <span class="tab-name">${escHtml(name)}</span>
          <button class="tab-close" title="Close" onclick="closeTab(${JSON.stringify(id)}, event)">&#x2715;</button>
        </div>`;
      }).join('');
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Open modal whenever #modal-content receives new content via HTMX
    document.body.addEventListener('htmx:afterSwap', e => {
      if (e.detail.target && e.detail.target.id === 'modal-content')
        document.getElementById('modal-overlay').classList.add('visible');
    });

    // ═══════════════════════════════════════════════════════════════
    //  Modal
    // ═══════════════════════════════════════════════════════════════
    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('visible');
    }
    function handleOverlayClick(e) {
      if (e.target === document.getElementById('modal-overlay')) closeModal();
    }
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
      // Delete-node keybinding (REQ-TRS-DE-004) — only while a sprotty-kind
      // diagram tab is active, and never while typing in a form field.
      if ((e.key === 'Delete' || e.key === 'Backspace') && !e.target.closest('input,textarea')) {
        const tab = activeTabId && tabState.get(activeTabId);
        if (tab && isSprottyKind(tab.kind) && window.DiagramEditor) {
          e.preventDefault();
          window.DiagramEditor.deleteSelected();
        }
      }
    });

    // ═══════════════════════════════════════════════════════════════
    //  Element property editing (Layer 1)
    // ═══════════════════════════════════════════════════════════════
    function showEditForm() {
      document.getElementById('detail-view-mode').style.display = 'none';
      document.getElementById('detail-edit-mode').style.display = 'block';
      document.getElementById('edit-error').style.display = 'none';
      document.getElementById('edit-name').focus();
    }
    function hideEditForm() {
      document.getElementById('detail-edit-mode').style.display = 'none';
      document.getElementById('detail-view-mode').style.display = '';
      document.getElementById('edit-error').style.display = 'none';
    }
    // `fields` carries `name` (still user-editable, just no longer a
    // top-level request key) plus whatever the user edited in the
    // `#edit-extra` YAML textarea. That textarea's content is sent verbatim
    // as `extraYaml` and parsed server-side (`update_element`'s
    // `merge_extra_yaml`, `crates/syscribe-server/src/routes/mutate.rs`) —
    // deliberately not parsed here in JS, since frontmatter can contain
    // arbitrarily nested YAML (lists, nested maps) that a hand-rolled
    // client-side parser would be too easy to get subtly wrong on.
    function showEditError(message) {
      const el = document.getElementById('edit-error');
      el.textContent = message;
      el.style.display = message ? 'block' : 'none';
    }
    async function saveElement() {
      const editEl = document.getElementById('detail-edit-mode');
      const qname  = editEl.dataset.qname;
      const name   = document.getElementById('edit-name').value.trim();
      const doc    = document.getElementById('edit-doc').value;
      const extraYaml = document.getElementById('edit-extra').value;
      const btn    = editEl.querySelector('.btn-primary');
      showEditError('');
      btn.textContent = 'Saving…'; btn.disabled = true;
      try {
        const resp = await fetch('/api/elements/' + qname.replace(/::/g, '/'), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fields: { name }, extraYaml, doc, dryRun: false }),
        });
        const result = await resp.json().catch(() => null);
        if (resp.ok && result && result.written) {
          htmx.ajax('GET', '/ui/detail/' + qname.replace(/::/g, '/'),
                    { target: '#modal-content', swap: 'innerHTML' });
          return;
        }
        const errs = (result && result.newErrors || []).map(f => `${f.code}: ${f.message}`).join('; ');
        const reason = (result && result.reason) || errs || `Save failed (${resp.status})`;
        showEditError(reason);
      } catch (err) {
        showEditError('Save failed: ' + err.message);
      } finally {
        btn.textContent = 'Save'; btn.disabled = false;
      }
    }

    // Tree: highlight selected item
    function setActiveTreeItem(el) {
      document.querySelectorAll('.tree-item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
    }

  </script>
</body>
</html>
