[package]
name = "syscribe"
version = "0.53.0"
edition = "2021"

[[bin]]
name = "syscribe"
path = "src/main.rs"

[features]
default = []
# FMI Co-Simulation plants (REQ-TRS-FMI-001): off by default.
fmi = ["dep:syscribe-fmi"]

[dependencies]
syscribe-model = { path = "../syscribe-model" }
syscribe-fmi = { path = "../syscribe-fmi", optional = true }
serde_yaml = { workspace = true }
quick-xml = { workspace = true }
toml = { workspace = true }
regex = { workspace = true }
walkdir = { workspace = true }
taffy = "0.11"
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
clap = "4"
svg = "0.18.0"
rhai = "=1.25.1"
rmcp = { version = "1", features = ["server", "transport-io", "macros"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
schemars = "1"
tokio = { workspace = true }
notify = { workspace = true }
anyhow = { workspace = true }
petgraph = { workspace = true }
tower-lsp = "0.20.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
