    <text x="270" y="464" text-anchor="middle" font-size="9" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" font-style="italic" fill="#b7791f">[1 MCS]</text>
  </g>
  <g id="s-safety-ft-both" class="gate-and FaultTreeGate" sysml:ref="Safety::FT::Both">
