<svg xmlns="http://www.w3.org/2000/svg" xmlns:sysml="urn:syscribe:1.0" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 405.33 584" width="405.33" height="584" class="syscribe-diagram FaultTree" sysml:ref="Diagrams::FtD">
  <title>FtD</title>
  <defs>
