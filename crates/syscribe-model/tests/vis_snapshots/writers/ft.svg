    <text x="95" y="451" text-anchor="middle" font-size="10" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" fill="#333">λ 1.0e-4/h · P 9.5e-2</text>
    <text x="95" y="464" text-anchor="middle" font-size="9" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" font-style="italic" fill="#b7791f">[1 MCS]</text>
  </g>
