    <text x="20" y="569" text-anchor="start" font-size="10" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" fill="#555" font-style="italic">Arrows point in the direction a fault propagates, toward the top event.</text>
