  <path id="e-input-s-safety-ft-both-s-safety-ft-a" class="edge input" sysml:ref="Safety::FT::Both" sysml:source="s-safety-ft-both" sysml:target="s-safety-ft-a" marker-start="url(#arrow-filled)" d="M 116.83,326 L 116.83,346 L 95,346 L 95,392" fill="none" stroke="#555" stroke-width="1.4"/>
  <path id="e-input-s-safety-ft-both-s-safety-ft-b" class="edge input" sysml:ref="Safety::FT::Both" sysml:source="s-safety-ft-both" sysml:target="s-safety-ft-b" marker-start="url(#arrow-filled)" d="M 116.83,326 L 116.83,346 L 270,346 L 270,392" fill="none" stroke="#555" stroke-width="1.4"/>
  <path id="e-input-s-safety-ft-top-s-safety-ft-both" class="edge input" sysml:ref="Safety::FT::Top" sysml:source="s-safety-ft-top" sysml:target="s-safety-ft-both" marker-start="url(#arrow-filled)" d="M 142.5,156 L 142.5,176 L 116.83,176 L 116.83,228" fill="none" stroke="#555" stroke-width="1.4"/>
  <path id="e-input-s-safety-ft-top-s-safety-ft-c" class="edge input" sysml:ref="Safety::FT::Top" sysml:source="s-safety-ft-top" sysml:target="s-safety-ft-c" marker-start="url(#arrow-filled)" d="M 142.5,156 L 142.5,176 L 303.83,176 L 303.83,216" fill="none" stroke="#555" stroke-width="1.4"/>
  <g class="legend">
    <rect x="20" y="528" width="16" height="10" rx="2" fill="#fdecea" stroke="#b3261e" stroke-width="1.4"/>
    <text x="44" y="537" text-anchor="start" font-size="10" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" fill="#333">single point of failure</text>
    <rect x="20" y="544" width="16" height="10" rx="2" fill="#fff4d6" stroke="#b7791f" stroke-width="1.4"/>
