<svg xmlns="http://www.w3.org/2000/svg" xmlns:sysml="urn:syscribe:1.0" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 532.5 588" width="532.5" height="588" class="syscribe-diagram SafetyCase" sysml:ref="Diagrams::GsnD">
  <title>GsnD</title>
  <defs>
    <marker id="arrow-filled" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0,0 L 10,4 L 0,8 z" fill="#555" stroke="#555" stroke-width="1.2"/></marker>
    <marker id="arrow-inherit" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0,0 L 12,5 L 0,10 z" fill="#fff" stroke="#555" stroke-width="1.2"/></marker>
  </defs>
  <g id="s-safety-sg" class="goal SafetyGoal" sysml:ref="Safety::SG">
    <rect x="65.5" y="20" width="131" height="65" rx="0" fill="#fff4d6" stroke="#b7791f" stroke-width="3"/>
    <text x="131" y="37" text-anchor="middle" font-size="12" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" font-weight="bold" fill="#222">SG-DS-001</text>
    <text x="98.5" y="51" text-anchor="start" font-size="10" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" fill="#333">Avoid harm</text>
    <text x="131" y="65" text-anchor="middle" font-size="10" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" font-weight="bold" fill="#b7791f">undeveloped</text>
    <text x="131" y="79" text-anchor="middle" font-size="10" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" fill="#333">verdict incomplete</text>
  </g>
  <g id="s-safety-case-strategy" class="strategy Argument" sysml:ref="Safety::Case::Strategy">
    <path d="M 59,145 L 221,145 L 203,217 L 41,217 Z" fill="#fff4d6" stroke="#b7791f" stroke-width="1.4"/>
    <text x="131" y="164.5" text-anchor="middle" font-size="12" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" font-weight="bold" fill="#222">ARG-DS-001</text>
    <text x="98.5" y="178.5" text-anchor="start" font-size="10" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" fill="#333">Argue over</text>
    <text x="67" y="192.5" text-anchor="start" font-size="10" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" fill="#333">independent channels</text>
    <text x="131" y="206.5" text-anchor="middle" font-size="10" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" font-weight="bold" fill="#b7791f">undeveloped</text>
  </g>
  <g id="s-safety-req" class="goal Requirement" sysml:ref="Safety::REQ">
    <rect x="352" y="303" width="150" height="51" rx="0" fill="#fff4d6" stroke="#b7791f" stroke-width="1.4"/>
    <text x="427" y="320" text-anchor="middle" font-size="12" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" font-weight="bold" fill="#222">REQ-DS-001</text>
    <text x="360" y="334" text-anchor="start" font-size="10" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" fill="#333">Comparator shall trip</text>
    <text x="427" y="348" text-anchor="middle" font-size="10" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" font-weight="bold" fill="#b7791f">unverified</text>
  </g>
  <g id="s-safety-tc" class="solution TestCase" sysml:ref="Safety::TC">
    <ellipse cx="427" cy="479" rx="85.5" ry="49" fill="#fff4d6" stroke="#b7791f" stroke-width="1.4"/>
    <text x="427" y="462.5" text-anchor="middle" font-size="12" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" font-weight="bold" fill="#222">TC-DS-001</text>
    <text x="397.5" y="476.5" text-anchor="start" font-size="10" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" fill="#333">Trip test</text>
    <text x="427" y="490.5" text-anchor="middle" font-size="10" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" font-weight="bold" fill="#b7791f">unverified</text>
    <text x="427" y="504.5" text-anchor="middle" font-size="10" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" fill="#333">unknown</text>
  </g>
  <g id="s-safety-case-claim" class="undeveloped-goal Argument" sysml:ref="Safety::Case::Claim">
    <path d="M 192,287 L 312,287 L 312,352 L 192,352 Z" fill="#fff4d6" stroke="#b7791f" stroke-width="1.4"/>
    <path d="M 252,353 L 260,361 L 252,369 L 244,361 Z" fill="#fff" stroke="#b7791f" stroke-width="1.4"/>
    <text x="252" y="304" text-anchor="middle" font-size="12" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" font-weight="bold" fill="#222">ARG-DS-003</text>
    <text x="210" y="318" text-anchor="start" font-size="10" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" fill="#333">Channels fail</text>
    <text x="210" y="332" text-anchor="start" font-size="10" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" fill="#333">independently</text>
    <text x="252" y="346" text-anchor="middle" font-size="10" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" font-weight="bold" fill="#b7791f">UNDEVELOPED</text>
  </g>
  <g id="s-safety-case-context" class="context Argument" sysml:ref="Safety::Case::Context">
    <rect x="20" y="287" width="132" height="46" rx="23" fill="#f5f5f5" stroke="#666" stroke-width="1.4"/>
    <text x="86" y="307.5" text-anchor="middle" font-size="12" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" font-weight="bold" fill="#222">ARG-DS-002</text>
    <text x="41" y="321.5" text-anchor="start" font-size="10" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" fill="#333">Single vehicle</text>
  </g>
  <path id="e-supportedBy-s-safety-req-s-safety-tc" class="edge supportedBy" sysml:ref="Safety::REQ" sysml:source="s-safety-req" sysml:target="s-safety-tc" marker-end="url(#arrow-filled)" d="M 427,354 L 427,430" fill="none" stroke="#555" stroke-width="1.4"/>
  <path id="e-supportedBy-s-safety-case-strategy-s-safety-req" class="edge supportedBy" sysml:ref="Safety::Case::Strategy" sysml:source="s-safety-case-strategy" sysml:target="s-safety-req" marker-end="url(#arrow-filled)" d="M 131,217 L 131,237 L 427,237 L 427,303" fill="none" stroke="#555" stroke-width="1.4"/>
  <path id="e-supportedBy-s-safety-case-strategy-s-safety-case-claim" class="edge supportedBy" sysml:ref="Safety::Case::Strategy" sysml:source="s-safety-case-strategy" sysml:target="s-safety-case-claim" marker-end="url(#arrow-filled)" d="M 131,217 L 131,237 L 252,237 L 252,287" fill="none" stroke="#555" stroke-width="1.4"/>
  <path id="e-inContextOf-s-safety-case-strategy-s-safety-case-context" class="edge inContextOf" sysml:ref="Safety::Case::Strategy" sysml:source="s-safety-case-strategy" sysml:target="s-safety-case-context" marker-end="url(#arrow-inherit)" d="M 131,217 L 131,251 L 86,251 L 86,287" fill="none" stroke="#555" stroke-width="1.4"/>
  <path id="e-supportedBy-s-safety-sg-s-safety-case-strategy" class="edge supportedBy" sysml:ref="Safety::SG" sysml:source="s-safety-sg" sysml:target="s-safety-case-strategy" marker-end="url(#arrow-filled)" d="M 131,85 L 131,145" fill="none" stroke="#555" stroke-width="1.4"/>
  <g class="legend">
    <rect x="20" y="548" width="16" height="10" rx="2" fill="#fff4d6" stroke="#b7791f" stroke-width="1.4"/>
    <text x="44" y="557" text-anchor="start" font-size="10" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" fill="#333">unverified or undeveloped</text>
    <text x="20" y="573" text-anchor="start" font-size="10" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" fill="#555" font-style="italic">Solid arrowheads are SupportedBy, hollow ones InContextOf. A diamond under a goal marks it undeveloped.</text>
  </g>
</svg>
