<svg xmlns="http://www.w3.org/2000/svg" xmlns:sysml="urn:syscribe:1.0" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 700 510" width="700" height="510" class="syscribe-diagram BDD" sysml:ref="Diagrams::SysBDD">
  <title>SysBDD</title>
  <defs>
