    <text x="490" y="318" text-anchor="middle" font-size="10" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" fill="#555" stroke="#fff" stroke-width="3" paint-order="stroke">motor [2]</text>
  <path id="e-composition-s-sys-powersystem-s-sys-motor-aux" class="edge composition" sysml:ref="Sys::PowerSystem::aux" sysml:source="s-sys-powersystem" sysml:target="s-sys-motor" marker-start="url(#arrow-composition)" d="M 424.23,420 L 555.77,230" fill="none" stroke="#555" stroke-width="1.4"/>
