  <path id="e-inheritance-s-sys-engine-s-sys-base" class="edge inheritance" sysml:ref="Sys::Engine" sysml:source="s-sys-engine" sysml:target="s-sys-base" marker-end="url(#arrow-inherit)" d="M 262.8,160 L 354.52,70" fill="none" stroke="#555" stroke-width="1.4"/>
  <path id="e-inheritance-s-sys-motor-s-sys-base" class="edge inheritance" sysml:ref="Sys::Motor" sysml:source="s-sys-motor" sysml:target="s-sys-base" marker-end="url(#arrow-inherit)" d="M 533.33,160 L 413.33,70" fill="none" stroke="#555" stroke-width="1.4"/>
  <path id="e-association-s-sys-engine-s-sys-motor-powerlink" class="edge association" sysml:ref="Sys::PowerLink" sysml:source="s-sys-engine" sysml:target="s-sys-motor" d="M 320,200.06 L 480,196.94" fill="none" stroke="#555" stroke-width="1.4"/>
