<svg xmlns="http://www.w3.org/2000/svg" xmlns:sysml="urn:syscribe:1.0" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 347.33 528" width="347.33" height="528" class="syscribe-diagram AttackTree" sysml:ref="Diagrams::AtD">
  <title>AtD</title>
  <defs>
