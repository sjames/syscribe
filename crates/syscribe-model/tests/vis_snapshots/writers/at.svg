    <text x="44" y="465" text-anchor="start" font-size="10" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" fill="#333">high attack feasibility</text>
    <rect x="20" y="472" width="16" height="10" rx="2" fill="#fff4d6" stroke="#b7791f" stroke-width="1.4"/>
    <text x="44" y="481" text-anchor="start" font-size="10" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" fill="#333">medium attack feasibility</text>
    <rect x="20" y="488" width="16" height="10" rx="2" fill="#e3f5e8" stroke="#1e8a3c" stroke-width="1.4"/>
    <text x="44" y="497" text-anchor="start" font-size="10" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" fill="#333">low or very low attack feasibility</text>
    <text x="20" y="513" text-anchor="start" font-size="10" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" fill="#555" font-style="italic">Heavy red edges follow the easiest attack path. Arrows point toward the goal.</text>
