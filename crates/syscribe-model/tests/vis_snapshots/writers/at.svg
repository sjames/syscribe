    <text x="215.83" y="247" text-anchor="start" font-size="10" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" fill="#333">Remote injection</text>
    <text x="267.33" y="261" text-anchor="middle" font-size="10" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" font-weight="bold" fill="#1e8a3c">feasibility low</text>
  </g>
  <path id="e-input-s-security-at-chain-s-security-at-s1" class="edge criticalPath" sysml:ref="Security::AT::Chain" sysml:source="s-security-at-chain" sysml:target="s-security-at-s1" marker-start="url(#arrow-filled)" d="M 101.83,325 L 101.83,345 L 80,345 L 80,385" fill="none" stroke="#b3261e" stroke-width="3"/>
  <path id="e-input-s-security-at-chain-s-security-at-s2" class="edge criticalPath" sysml:ref="Security::AT::Chain" sysml:source="s-security-at-chain" sysml:target="s-security-at-s2" marker-start="url(#arrow-filled)" d="M 101.83,325 L 101.83,345 L 245.5,345 L 245.5,385" fill="none" stroke="#b3261e" stroke-width="3"/>
  <path id="e-input-s-security-at-root-s-security-at-chain" class="edge criticalPath" sysml:ref="Security::AT::Root" sysml:source="s-security-at-root" sysml:target="s-security-at-chain" marker-start="url(#arrow-filled)" d="M 136.17,156 L 136.17,176 L 101.83,176 L 101.83,216" fill="none" stroke="#b3261e" stroke-width="3"/>
  <path id="e-input-s-security-at-root-s-security-at-s3" class="edge input" sysml:ref="Security::AT::Root" sysml:source="s-security-at-root" sysml:target="s-security-at-s3" marker-start="url(#arrow-filled)" d="M 136.17,156 L 136.17,176 L 267.33,176 L 267.33,216" fill="none" stroke="#555" stroke-width="1.4"/>
  <g class="legend">
