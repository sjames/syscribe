    <text x="136.17" y="79" text-anchor="middle" font-size="10" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" fill="#333">threat TS-DS-001 declares high</text>
    <text x="136.17" y="92" text-anchor="middle" font-size="9" font-family="Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif" font-style="italic" fill="#b7791f">[W035]</text>
  </g>
  <g id="s-security-at-s1" class="step AttackStep" sysml:ref="Security::AT::S1">
    <rect x="20" y="385" width="120" height="51" rx="3" fill="#fdecea" stroke="#b3261e" stroke-width="3"/>
