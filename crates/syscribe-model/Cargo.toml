[package]
name = "syscribe-model"
version = "0.53.0"
edition = "2021"

[dependencies]
serde = { workspace = true }
serde_yaml = { workspace = true }
walkdir = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
petgraph = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
serde_json = { workspace = true }
quick-xml = { workspace = true }
# Pinned: feature-model SAT analysis engine (MIT, pure Rust, MiniSat lineage).
batsat = "=0.6.0"
# Content-baseline digest for suspect-link detection (§SuspectLinks; MIT/Apache, pure Rust).
blake3 = "1"
# Native SysML v2/KerML textual-notation AST parser (MIT, pure Rust; ADR-SYS-SYSMLV2-001).
sysml-v2-parser = "0.57.0"
# Diagram text metrics (`vis::metrics`, REQ-TRS-VIS-017): system-font glyph advances.
ab_glyph = "0.2.32"
fontdb = "0.23.0"
# Embedded JavaScript engine running the vendored `elk.bundled.js` in-process
# (`vis::layout`, REQ-TRS-VIS-016; QuickJS, MIT; built by `cc` — a C compiler is
# needed at build time).
rquickjs = "0.14"

# Unix-only: the stdio-plugin runtime masks SIGPIPE while writing a plugin's
# request (`plugins/runtime.rs`); `syscribe` restores SIGPIPE's default so
# piped output exits quietly, which would otherwise kill the process when a
# plugin exits without reading its stdin.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
